<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="人格羁绊">
  <!--
    A pure glyph: transparent background, one solid colour (see bond-sees.svg for why — `.bglyph img` tints every opaque
    pixel to one hue). Two interlocking rings = the bond a worn persona grants on its own.
  -->
  <g fill="none" stroke="#ffffff" stroke-width="7">
    <circle cx="24" cy="32" r="14.5"/>
    <circle cx="40" cy="32" r="14.5"/>
  </g>
</svg>
